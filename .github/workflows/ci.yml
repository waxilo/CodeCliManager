name: CI

on:
  pull_request:
    branches:
      - main
  # 日常直推 main 的提交也需要门禁；tag 推送走独立事件，与 branch push 互不重复
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS-ARM64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS-x64
          - platform: windows-latest
            args: ''
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 测试只在一个平台跑一次，避免矩阵重复；构建在全部平台执行
      - name: Run frontend tests
        if: matrix.name == 'macOS-x64'
        run: npm test

      - name: Run Rust tests
        if: matrix.name == 'macOS-x64'
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        # CI 无签名私钥，临时关闭 updater 产物以避免签名失败；Release 工作流才生成并签名
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeCliManager-${{ matrix.name }}
          # macOS cross-compile outputs to target/<triple>/release/bundle/
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 14
