name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v0.1.0）'
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS-ARM64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS-x64
          - platform: windows-latest
            args: ''
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 手动发布构建输入 tag；tag push 构建触发本次运行的当前 ref。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Invalid release tag: ${tag}`);
          }

          const expected = tag.slice(1);
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = {
            'package.json': packageJson.version,
            'package-lock.json': packageLock.version,
            'package-lock.json root package': packageLock.packages?.['']?.version,
            'src-tauri/tauri.conf.json': tauriConfig.version,
            'src-tauri/Cargo.toml': cargoVersion,
          };
          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length) {
            throw new Error(`Tag ${tag} expects ${expected}; mismatches: ${mismatches.map(([file, version]) => `${file}=${version}`).join(', ')}`);
          }
          console.log(`Validated ${tag} against package, Tauri, Cargo, and lockfile versions.`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Detect frontend tests
        id: frontend-tests
        shell: bash
        run: node -e "console.log('exists=' + Boolean(require('./package.json').scripts?.test))" >> "$GITHUB_OUTPUT"

      - name: Test frontend
        if: steps.frontend-tests.outputs.exists == 'true'
        run: npm test

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        env:
          # 生成 updater 签名产物需要私钥；未配置时打包会在签名步骤失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find_installer() {
            local platform="$1"
            local pattern="$2"
            find "artifacts/${platform}" -type f -name "${pattern}" | head -n 1
          }

          copy_or_fail() {
            local src="$1"
            local dest="$2"
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "Missing release asset: $dest"
              exit 1
            fi
            cp "$src" "release-assets/$dest"
            echo "Prepared: $dest"
          }

          ARM64_DMG="$(find_installer macOS-ARM64 '*.dmg')"
          X64_DMG="$(find_installer macOS-x64 '*.dmg')"
          WIN_MSI="$(find_installer Windows-x64 '*.msi')"
          WIN_EXE="$(find_installer Windows-x64 '*.exe')"

          copy_or_fail "$ARM64_DMG" "CodeCliManager-${RELEASE_TAG}-macOS-ARM64.dmg"
          copy_or_fail "$X64_DMG" "CodeCliManager-${RELEASE_TAG}-macOS-x64.dmg"
          copy_or_fail "$WIN_MSI" "CodeCliManager-${RELEASE_TAG}-Windows-x64.msi"
          copy_or_fail "$WIN_EXE" "CodeCliManager-${RELEASE_TAG}-Windows-x64-setup.exe"

          # —— updater 产物（应用内自动更新使用）——
          # macOS：应用自动更新使用 .app.tar.gz + .sig（dmg 不参与自动更新）
          ARM64_TAR="$(find_installer macOS-ARM64 '*.app.tar.gz')"
          X64_TAR="$(find_installer macOS-x64 '*.app.tar.gz')"
          copy_or_fail "$ARM64_TAR" "CodeCliManager-${RELEASE_TAG}-macOS-ARM64.app.tar.gz"
          copy_or_fail "${ARM64_TAR}.sig" "CodeCliManager-${RELEASE_TAG}-macOS-ARM64.app.tar.gz.sig"
          copy_or_fail "$X64_TAR" "CodeCliManager-${RELEASE_TAG}-macOS-x64.app.tar.gz"
          copy_or_fail "${X64_TAR}.sig" "CodeCliManager-${RELEASE_TAG}-macOS-x64.app.tar.gz.sig"

          # Windows：自动更新直接使用 NSIS setup.exe + 其签名（tauri 不生成 zip 更新包）
          WIN_SETUP_SIG="$(find_installer Windows-x64 '*-setup.exe.sig')"
          copy_or_fail "$WIN_SETUP_SIG" "CodeCliManager-${RELEASE_TAG}-Windows-x64-setup.exe.sig"

          ls -la release-assets/

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 变更说明：优先取附注 tag 正文，其次取被打 tag 提交的正文
          git fetch --tags --force >/dev/null 2>&1 || true
          CHANGELOG="$(git tag -l --format='%(contents:body)' "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="$(git log -1 --format=%b "$RELEASE_TAG" 2>/dev/null || true)"
          fi
          printf '%s' "$CHANGELOG" > .release-changelog.txt

          # 用 Node 生成 latest.json，避免 bash 手工拼接 JSON 的转义问题
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const read = (name) => fs.readFileSync(`release-assets/${name}`, 'utf8').trim();
          const notes = fs.readFileSync('.release-changelog.txt', 'utf8').trim();
          const base = `https://github.com/${repo}/releases/download/${tag}`;
          const manifest = {
            version: tag.replace(/^v/, ''),
            notes: notes || null,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': {
                signature: read(`CodeCliManager-${tag}-macOS-ARM64.app.tar.gz.sig`),
                url: `${base}/CodeCliManager-${tag}-macOS-ARM64.app.tar.gz`,
              },
              'darwin-x86_64': {
                signature: read(`CodeCliManager-${tag}-macOS-x64.app.tar.gz.sig`),
                url: `${base}/CodeCliManager-${tag}-macOS-x64.app.tar.gz`,
              },
              'windows-x86_64': {
                signature: read(`CodeCliManager-${tag}-Windows-x64-setup.exe.sig`),
                url: `${base}/CodeCliManager-${tag}-Windows-x64-setup.exe`,
              },
            },
          };
          fs.writeFileSync('release-assets/latest.json', JSON.stringify(manifest, null, 2));
          console.log('Generated release-assets/latest.json');
          NODE

          echo "--- latest.json ---"
          cat release-assets/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # 读取本次发布的变更说明：优先取附注 tag 正文，其次取被打 tag 提交的正文
          git fetch --tags --force >/dev/null 2>&1 || true
          CHANGELOG="$(git tag -l --format='%(contents:body)' "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="$(git log -1 --format=%b "$RELEASE_TAG" 2>/dev/null || true)"
          fi

          {
            echo "## CodeCliManager ${RELEASE_TAG}"
            echo
            echo "### 更新内容"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "- 详见提交记录"
            fi
            echo
            echo "### macOS"
            echo "- Apple Silicon (M 系列): \`CodeCliManager-${RELEASE_TAG}-macOS-ARM64.dmg\`"
            echo "- Intel Mac: \`CodeCliManager-${RELEASE_TAG}-macOS-x64.dmg\`"
            echo
            echo "### Windows"
            echo "- \`CodeCliManager-${RELEASE_TAG}-Windows-x64.msi\`"
            echo "- \`CodeCliManager-${RELEASE_TAG}-Windows-x64-setup.exe\`"
            echo
            echo "### 自动更新"
            echo "已安装的旧版本可在应用右上角「更新」按钮一键下载并安装本版本。"
            echo
            echo "> 首次在 macOS 打开若提示未验证开发者，请在「系统设置 → 隐私与安全性」中允许运行。"
          } > release-notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, uploading assets..."
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "CodeCliManager ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
